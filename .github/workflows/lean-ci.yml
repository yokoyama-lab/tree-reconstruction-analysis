name: lean-ci

on:
  push:
    paths: ["lean/**", ".github/workflows/lean-ci.yml"]
  pull_request:
    paths: ["lean/**", ".github/workflows/lean-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake
            ~/.cache/mathlib
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build and check axioms
        run: bash ./check-axioms.sh

      - name: Check headline statements against the freeze lock
        # check-axioms.sh proves nothing leans on sorryAx; it does not check
        # *what* was proved.  A weakened statement (extra hypothesis, raised
        # bound) passes the build and the axiom check but fails here.
        run: SKIP_BUILD=1 bash ./check-statements.sh

      - name: Self-test the freeze gate (destructive)
        # A gate that never fires is worse than no gate: this breaks the lock on
        # purpose and asserts the checker reports it.
        run: SKIP_BUILD=1 bash ./test-check-statements.sh
